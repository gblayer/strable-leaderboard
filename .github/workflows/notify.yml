name: Notify

# The cluster's dispatcher asks for the maintainer with a repository_dispatch event. This workflow
# turns it into a comment by github-actions[bot] that mentions @gblayer, so GitHub emails her; a
# comment made with her own token would not. The event says nothing about what happened: that stays
# in the dispatcher's private log.
#
#   POST /repos/gblayer/strable-leaderboard/dispatches
#   {"event_type": "maintainer-follow-up", "client_payload": {"pr": 12}}
#
# Without a pull request number it opens an issue instead.
on:
  repository_dispatch:
    types: [maintainer-follow-up]

permissions:
  pull-requests: write
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.client_payload.pr }}
        run: |
          body='@gblayer The maintainer will follow up.'
          if [[ "$PR" =~ ^[0-9]+$ ]]; then
            gh pr comment "$PR" --repo "$REPO" --body "$body"
            gh pr edit "$PR" --repo "$REPO" --add-label needs-maintainer || true
          else
            gh issue create --repo "$REPO" --title "Maintainer follow-up" --body "$body"
          fi
