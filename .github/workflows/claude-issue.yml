name: Claude works on an issue

# A maintainer adds the label `claude` to an issue; Claude implements it on a branch and links a
# pull request, which goes through the normal review. Only people with write access can add
# labels. Needs the secret CLAUDE_CODE_OAUTH_TOKEN and the label `claude`.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  work:
    if: github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            A maintainer asked you to work on this issue. Read it with `gh issue view`.
            Read README.md, docs/protocol.md, docs/submitting.md and docs/automation.md first and respect them.
            Make the smallest change that resolves the issue, run `pytest`, push a branch,
            and comment on the issue with a summary and the link to open the pull request.
            If the issue is unclear or conflicts with those documents, comment with a question instead.
