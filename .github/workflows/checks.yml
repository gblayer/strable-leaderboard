name: Checks

# Runs on every pull request, on GitHub's machines, with a read-only token and no secrets. It is the
# only place where contributor code runs before the merge. For each changed model folder:
# - the card, the pins and the code (`smoke --static`): every model.yaml field filled and valid,
#   every pin equal to the shared environment's (env/requirements.txt), no own folds, search or seed;
# - the smoke test on CPU for `hardware: cpu` models. GPU models get theirs on the reference GPU on
#   the cluster, as the dispatcher's first step after the merge (GitHub's free runners have no GPU).
# The model is installed with env/requirements.txt as constraints, so every package, dependencies
# included, has the shared environment's version. A changed site/results.json is validated.
on:
  pull_request:
    paths:
      - "models/**"
      - "site/results.json"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List what this pull request changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          models=$(git diff --name-only "$BASE_SHA" HEAD -- models/ | cut -d/ -f2 | sort -u \
            | grep -E '^[a-z0-9][a-z0-9.-]*$' | grep -v '^_template$' || true)
          results=$(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- site/results.json || true)
          echo "models=$(echo $models)" >> "$GITHUB_OUTPUT"
          echo "results=$(echo $results)" >> "$GITHUB_OUTPUT"
          echo "Model folders: ${models:-none}. Results files: ${results:-none}."

      - name: Card, pins, code and smoke test of each changed model
        if: steps.changed.outputs.models != ''
        env:
          MODELS: ${{ steps.changed.outputs.models }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -o pipefail
          status=0
          for m in $MODELS; do
            [ -d "models/$m" ] || continue
            echo "::group::$m"
            python -m venv "/tmp/env-$m"
            py="/tmp/env-$m/bin/python"
            "$py" -m pip install --quiet pyyaml
            if PYTHONPATH=. "$py" -m strable_leaderboard.check_requirements "models/$m"; then
              "$py" -m pip install --quiet -c env/requirements.txt -e ".[smoke]" -r "models/$m/requirements.txt"
              if grep -qE '^hardware:[[:space:]]*cpu' "models/$m/model.yaml"; then
                "$py" -m strable_leaderboard.smoke "models/$m" | tee -a "$GITHUB_STEP_SUMMARY" || status=1
              else
                "$py" -m strable_leaderboard.smoke "models/$m" --static | tee -a "$GITHUB_STEP_SUMMARY" || status=1
                echo "GPU model: the smoke test runs on the reference GPU after the merge." | tee -a "$GITHUB_STEP_SUMMARY"
              fi
            else
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Validate site/results.json
        if: steps.changed.outputs.results != ''
        run: |
          set -o pipefail
          pip install --quiet -c env/requirements.txt -e .
          python scripts/build_site_data.py --check site/results.json | tee -a "$GITHUB_STEP_SUMMARY"
