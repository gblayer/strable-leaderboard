name: Pages

# Deploys site/ to GitHub Pages on every push to main that touches it. GitHub Pages is free for
# public repositories, so the job waits until the repository is public. Switch it on once:
# Settings → Pages → Source: GitHub Actions. The page then answers at
# https://gblayer.github.io/strable-leaderboard/ and, with the custom domain, at https://strable.ai.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
