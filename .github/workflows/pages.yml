# test PR C: a change under .github/, never merged automatically
name: Pages

# Deploys site/ to GitHub Pages on every push to main that touches it. Pages is switched on under
# Settings → Pages → Source: GitHub Actions; the page answers at
# https://gblayer.github.io/strable-leaderboard/ and is public even while the repository is private.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
