name: Pages

# Deploys site/ to GitHub Pages on every push to main that touches it. Pages is switched on under
# Settings → Pages → Source: GitHub Actions; the page answers at
# https://gblayer.github.io/strable-leaderboard/ and is public even while the repository is private.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as GitHub's Pages starter workflows: build uploads site/, deploy publishes it once build has ended.
# Re-running the failed jobs of a run re-runs deploy alone, on the page build uploaded.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
