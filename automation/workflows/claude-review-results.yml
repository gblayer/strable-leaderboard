name: Claude checks and merges results

# Template. To enable: copy to .github/workflows/, add the CLAUDE_CODE_OAUTH_TOKEN secret,
# and set the repository variable RUNNER_LOGIN to the GitHub account the cluster runner uses.
#
# Results pull requests come from the runner, a trusted account with write access, so Claude
# may merge them.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "results/**"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  check:
    if: github.event.pull_request.user.login == vars.RUNNER_LOGIN
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Check this results pull request with .claude/skills/review-submission/SKILL.md, section B.
            If every item passes, post a short comment and run `gh pr merge ${{ github.event.pull_request.number }} --squash --auto`.
            Otherwise comment with what is wrong and do not merge.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr merge:*),Bash(python -m strable_leaderboard.*)"
