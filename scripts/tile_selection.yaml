# The TILE pipelines on STRABLE, the set scripts/import_tile_results.py imports: the TILE authors' runs
# with their current default settings (configs/tile_defaults.sh of their code; TILE paper:
# https://arxiv.org/abs/2610.17065). Each source row is one table and outer fold, on the board's 108
# tables and outer folds.
#
# TILE (named latte in its authors' code, hence the method tokens) is an encoder. Every row is written
# as one sentence, "The <column> is <value>." per cell, numbers included, and goes through the first
# 14 blocks of LLaMA-3.1-8B (TILE-8B) or the first 32 of the 80 blocks of LLaMA-3.1-70B (TILE-70B); the
# token states of each cell are averaged into one embedding per cell.
# Only the string columns' embeddings are kept, standardized on the training rows and reduced by one
# PCA per column to 30 components, the counts rescaled into the learner's feature window, which bounds
# its whole input (numerical columns, categories and target encoding included). The learner gets them
# with the numerical columns, an out-of-fold target encoding of the string columns and the string
# columns of fewer than 50 distinct values as categorical features.
#
# pipelines: source CSV (the TILE authors' compiled results) -> method token -> model folder, encoder
# id, variant, `hold: true` for a pipeline listed but not imported, and in `where` the source columns
# that pick TILE's default settings for that learner (`model` there is the source's language-model
# column). num-str_tabvec_causilo is the board's own Tf-Idf encoder, so it gets the id the runner gives
# a models/causilo folder with tfidf.

date: "2026-10"  # when the source rows were computed; a pipeline's own `date` overrides it
# hardware: the GPU of each source row when its CSV records one (column `gpu`), else the pipeline's own
# `hardware`, else "paper" (not recorded)
# Tf-Idf + Causilo: the GPU its job logs and launcher show; its CSV has no `gpu` column
# TILE + ChakraTab (medium): ChakraTab runs on YHat Labs' API, called as the board calls it (models/chakra-tab-medium),
# from TILE's code, 11-13 Nov 2026, with the feature window of its own search on the 27 probing tables (200-600).
# Its time is the measured wall-clock time of the call, network included, plus TILE's encoding: no time reported by
# the provider. TILE's code did not record the version per call; chakra-tab-2026-10 is the version YHat Labs
# reported on the board's own ChakraTab calls (4-5 Nov) and on 13 Nov.

# CASE + TILE's learners: CASE (SAP; https://arxiv.org/abs/2608.03565) is an encoder, run alone, with no other
# encoder: SAP's CaseTransformer (github.com/SAP-samples/case at f0bbd5a, weights huggingface.co/SAP/CASE) at its
# defaults, but the board's seed and the label's name "target"; its context reads the training rows and their labels
# (class names for classification), a new context per fold. As in SAP's example, the learner gets CaseTransformer's
# output, every column of the table, string columns as raw text, plus CASE's 32 (raw_text_card: all); the dates as
# numbers, as TILE's runs give them. The learners are TILE's, called by TILE's code at their defaults, on the board's
# folds; run by the board's maintainer, Nov 2026.
# Its time is CASE's encoding (weights already loaded) and the dates' conversion, plus fit and predict. `gpu` is the
# learner's GPU (CASE encoded on an NVIDIA A40).

learners:  # model folder -> display name, for learners without a models/ folder
  causilo: Causilo
  kumo-tabular-small: Kumo Tabular (small)
  kumo-tabular-medium: Kumo Tabular (medium)

encoders:  # encoder id -> display name
  tile: TILE-8B
  tile-70b: TILE-70B
  case: CASE

settings: &tile  # TILE's default settings, the same for every learner
  model: llama3_14_layers_v2|cell_meanpool|include_numbers|clean
  standard_scaling: true
  per_column_components: 30
  string_cells_only: true
  normalize_cells: false
  cardinality_threshold: 50
  target_encode: proba
  window_total: true
settings_70b: &tile70b  # the same, with the embeddings of LLaMA-3.1-70B
  <<: *tile
  model: llama-3.1-70b_32_layers_v2|cell_meanpool|include_numbers|clean

pipelines:
  strable_tile.csv:  # one feature window per learner, chosen by the TILE authors
    num-str_latte_tabpfn: {model: tabpfn-2.5, encoder: tile, variant: default, where: {<<: *tile, feature_window: 200-400}}
    num-str_latte_tabicl: {model: tabicl-v2, encoder: tile, variant: default, where: {<<: *tile, feature_window: 200-800}}
    num-str_latte_tabpfn3: {model: tabpfn-3, encoder: tile, variant: default, where: {<<: *tile, feature_window: 150-400}}
    num-str_latte_tabpfn3.5: {model: tabpfn-3.5, encoder: tile, variant: default, where: {<<: *tile, feature_window: 200-800}}
    num-str_latte_causilo: {model: causilo, encoder: tile, variant: default, where: {<<: *tile, feature_window: 200-800}}
    num-str_latte_exaone: {model: exaone-tabular, encoder: tile, variant: default, hold: true, where: {<<: *tile, feature_window: 150-400}}
    num-str_latte_kumo_large: {model: kumo-tabular, encoder: tile, variant: default, where: {<<: *tile, feature_window: 200-600}}
    num-str_latte_kumo_medium: {model: kumo-tabular-medium, encoder: tile, variant: default, where: {<<: *tile, feature_window: 200-600}}
    num-str_latte_kumo_small: {model: kumo-tabular-small, encoder: tile, variant: default, where: {<<: *tile, feature_window: 200-600}}
    num-str_latte_chakra_tab: {model: chakra-tab-medium, encoder: tile, variant: default, date: "2026-11", hardware: api, api_version: chakra-tab-2026-10, where: {<<: *tile, feature_window: 200-600}}
  strable_tile_70b.csv:  # TILE-70B, the same windows; EXAONE-Tabular was not run on it
    num-str_latte_tabpfn: {model: tabpfn-2.5, encoder: tile-70b, variant: default, where: {<<: *tile70b, feature_window: 200-400}}
    num-str_latte_tabicl: {model: tabicl-v2, encoder: tile-70b, variant: default, where: {<<: *tile70b, feature_window: 200-800}}
    num-str_latte_tabpfn3: {model: tabpfn-3, encoder: tile-70b, variant: default, where: {<<: *tile70b, feature_window: 150-400}}
    num-str_latte_tabpfn3.5: {model: tabpfn-3.5, encoder: tile-70b, variant: default, where: {<<: *tile70b, feature_window: 200-800}}
    num-str_latte_causilo: {model: causilo, encoder: tile-70b, variant: default, where: {<<: *tile70b, feature_window: 200-800}}
    num-str_latte_kumo_large: {model: kumo-tabular, encoder: tile-70b, variant: default, where: {<<: *tile70b, feature_window: 200-600}}
    num-str_latte_kumo_medium: {model: kumo-tabular-medium, encoder: tile-70b, variant: default, where: {<<: *tile70b, feature_window: 200-600}}
    num-str_latte_kumo_small: {model: kumo-tabular-small, encoder: tile-70b, variant: default, where: {<<: *tile70b, feature_window: 200-600}}
    num-str_latte_chakra_tab: {model: chakra-tab-medium, encoder: tile-70b, variant: default, date: "2026-11", hardware: api, api_version: chakra-tab-2026-10, where: {<<: *tile70b, feature_window: 200-600}}
  strable_tfidf.csv:  # the board's Tf-Idf encoder, run by the TILE authors
    num-str_tabvec_causilo: {model: causilo, encoder: tfidf, variant: default, date: "2026-09", hardware: NVIDIA H100 80GB HBM3}
    num-str_tabvec_kumo_small: {model: kumo-tabular-small, encoder: tfidf, variant: default}
    num-str_tabvec_kumo_medium: {model: kumo-tabular-medium, encoder: tfidf, variant: default}
  strable_case.csv:  # CASE + TILE's 8 learners; held: not on the board
    case_tabpfn: {model: tabpfn-2.5, encoder: case, variant: default, date: "2026-11", hold: true, where: {model: case-f0bbd5a, raw_text_card: all}}
    case_tabicl: {model: tabicl-v2, encoder: case, variant: default, date: "2026-11", hold: true, where: {model: case-f0bbd5a, raw_text_card: all}}
    case_tabpfn3: {model: tabpfn-3, encoder: case, variant: default, date: "2026-11", hold: true, where: {model: case-f0bbd5a, raw_text_card: all}}
    case_tabpfn3.5: {model: tabpfn-3.5, encoder: case, variant: default, date: "2026-11", hold: true, where: {model: case-f0bbd5a, raw_text_card: all}}
    case_causilo: {model: causilo, encoder: case, variant: default, date: "2026-11", hold: true, where: {model: case-f0bbd5a, raw_text_card: all}}
    case_kumo_large: {model: kumo-tabular, encoder: case, variant: default, date: "2026-11", hold: true, where: {model: case-f0bbd5a, raw_text_card: all}}
    case_kumo_medium: {model: kumo-tabular-medium, encoder: case, variant: default, date: "2026-11", hold: true, where: {model: case-f0bbd5a, raw_text_card: all}}
    case_kumo_small: {model: kumo-tabular-small, encoder: case, variant: default, date: "2026-11", hold: true, where: {model: case-f0bbd5a, raw_text_card: all}}
